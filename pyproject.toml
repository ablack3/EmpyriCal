[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "empiricalcalibration"
version = "0.1.0"
description = "Empirical calibration of p-values and confidence intervals for observational studies — a Python port of the OHDSI R package EmpiricalCalibration 3.1.4"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# This is an independent port. The statistical methods, and the R package it
# reproduces, are the work of Martijn Schuemie and Marc Suchard (OHDSI); see
# NOTICE. They are credited rather than listed as authors here, because a PyPI
# author field is a contact point for this package, and they do not maintain it.
authors = [
    { name = "Adam Black", email = "ablack3@gmail.com" },
]
maintainers = [
    { name = "Adam Black", email = "ablack3@gmail.com" },
]
keywords = ["empirical calibration", "observational studies", "p-values",
            "negative controls", "OHDSI", "MaxSPRT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = ["jupyter>=1.0", "nbclient>=0.7"]

[project.urls]
Homepage = "https://ablack3.github.io/EmpyriCal/"
Documentation = "https://ablack3.github.io/EmpyriCal/"
Source = "https://github.com/ablack3/EmpyriCal"
"Upstream R package" = "https://github.com/OHDSI/EmpiricalCalibration"

[tool.hatch.build.targets.wheel]
packages = ["src/empiricalcalibration"]

[tool.hatch.build.targets.sdist]
include = ["src/empiricalcalibration", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["empiricalcalibration"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The public API deliberately keeps the R package's camelCase names, and the
# ports keep R's own argument names (including `iter`, which shadows a builtin).
ignore = ["E741", "A002"]
