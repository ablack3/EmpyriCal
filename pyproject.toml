[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "empiricalcalibration"
version = "3.1.4"
description = "Routines for performing empirical calibration of observational study estimates (Python port of the OHDSI R package)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Martijn Schuemie", email = "schuemie@ohdsi.org" },
    { name = "Marc Suchard" },
]
keywords = ["empirical calibration", "observational studies", "p-values",
            "negative controls", "OHDSI", "MaxSPRT"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = ["jupyter>=1.0", "nbclient>=0.7"]

[project.urls]
Homepage = "https://ablack3.github.io/EmpyriCal/"
Documentation = "https://ablack3.github.io/EmpyriCal/"
Source = "https://github.com/ablack3/EmpyriCal"
"Upstream R package" = "https://github.com/OHDSI/EmpiricalCalibration"

[tool.hatch.build.targets.wheel]
packages = ["src/empiricalcalibration"]

[tool.hatch.build.targets.sdist]
include = ["src/empiricalcalibration", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["empiricalcalibration"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The public API deliberately keeps the R package's camelCase names, and the
# ports keep R's own argument names (including `iter`, which shadows a builtin).
ignore = ["E741", "A002"]
